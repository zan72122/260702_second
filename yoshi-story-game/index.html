<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ヨッシーアイランドストーリー 〜フルーツだいすき!〜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec8e3; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic UI",
                 "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- 共通オーバーレイ ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    transition: opacity .4s ease;
  }
  .hidden { opacity: 0; pointer-events: none; }

  .bubble {
    background: rgba(255,255,255,.92);
    border: 6px solid #ff8fb1;
    border-radius: 32px;
    padding: 28px 44px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(60,30,60,.25);
    max-width: min(92vw, 640px);
    max-height: 82vh;
    overflow-y: auto;
  }

  h1.logo {
    font-size: clamp(24px, 4.6vw, 54px);
    white-space: nowrap;
    letter-spacing: .02em;
    background: linear-gradient(180deg,#3fbf46 15%, #2a9631 50%, #ff5b6e 50%, #e63950 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 4px 0 rgba(0,0,0,.06);
    transform: rotate(-2deg);
    margin-bottom: 6px;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: rotate(-2deg) translateY(0);} 50% { transform: rotate(-2deg) translateY(-8px);} }
  .subtitle { font-size: clamp(15px, 2.6vw, 22px); color: #b0578d; font-weight: bold; margin-bottom: 18px; }

  .press-start {
    font-size: clamp(18px, 3vw, 26px); font-weight: bold; color: #ff5b6e;
    animation: blink 1.1s steps(2) infinite; margin-top: 10px;
  }
  @keyframes blink { 50% { opacity: .15; } }

  .controls {
    margin-top: 16px; font-size: clamp(12px, 1.9vw, 15px); color: #555;
    line-height: 1.9; text-align: left; display: inline-block;
  }
  .controls b { color: #2a9631; background:#eaffe8; border-radius: 6px; padding: 1px 7px; border: 1px solid #bfe8bb; }

  .big-msg { font-size: clamp(36px, 8vw, 80px); font-weight: 900; color: #fff;
    text-shadow: 0 5px 0 rgba(0,0,0,.18), 0 0 30px rgba(255,255,180,.9); }
  .tally { font-size: clamp(16px, 3vw, 24px); color: #5a4; font-weight: bold; margin-top: 14px; line-height: 2; color: #7a5a2b; }
  .tally .num { color: #e6603e; font-size: 1.25em; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud .top {
    position: absolute; top: 10px; left: 12px; right: 12px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .hud-card {
    background: rgba(255,255,255,.85); border: 4px solid rgba(255,143,177,.9);
    border-radius: 20px; padding: 6px 14px; font-weight: 900;
    box-shadow: 0 4px 14px rgba(60,30,60,.18); font-size: clamp(15px,2.4vw,21px); color:#664;
  }
  #fruit-counter .goal { color: #b8a; font-size: .75em; }
  #fruit-counter.full { animation: pulse .5s ease infinite alternate; border-color:#ffd700; }
  @keyframes pulse { to { transform: scale(1.08); } }
  #fruit-row { letter-spacing: 2px; font-size: clamp(14px,2.2vw,19px); min-height: 1.3em; }
  #petals { font-size: clamp(17px,2.8vw,24px); letter-spacing: 1px; }
  #score-card { text-align: right; }
  #combo-label { color:#ff5b6e; font-size:.8em; height: 1.1em; }

  #stage-banner {
    position: absolute; top: 34%; left: 50%; transform: translate(-50%,-50%) scale(0);
    font-size: clamp(28px, 6vw, 56px); font-weight: 900; color: #fff; white-space: nowrap;
    text-shadow: 0 4px 0 rgba(0,0,0,.2), 0 0 24px rgba(255,255,255,.6);
    transition: transform .25s ease-in; z-index: 12;
  }
  /* 出現時だけバネのようなイージング (隠すときに使うと負スケールで反転してしまう) */
  #stage-banner.show {
    transform: translate(-50%,-50%) scale(1);
    transition: transform .45s cubic-bezier(.2,2.4,.4,1);
  }

  #hint-msg {
    position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); color: #fff; border-radius: 14px; padding: 8px 20px;
    font-weight: bold; font-size: clamp(13px,2.2vw,18px); opacity: 0; transition: opacity .3s;
    white-space: nowrap;
  }
  #hint-msg.show { opacity: 1; }

  /* スコアポップ(3D→2D投影で JS が位置指定) */
  .score-pop {
    position: fixed; pointer-events: none; z-index: 11; font-weight: 900;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); font-size: 18px;
    transform: translate(-50%,-50%); animation: rise 1s ease-out forwards;
  }
  @keyframes rise { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }

  /* ---------- タッチ操作 ---------- */
  #touch-ui { position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none; }
  body.touch #touch-ui { display: block; }
  .tbtn {
    position: absolute; pointer-events: auto; border-radius: 50%;
    background: rgba(255,255,255,.35); border: 3px solid rgba(255,255,255,.7);
    color: rgba(80,40,80,.8); font-weight: 900; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; touch-action: none;
  }
  .tbtn:active { background: rgba(255,255,255,.7); }
  #tb-left  { left: 18px;  bottom: 30px; }
  #tb-right { left: 100px; bottom: 30px; }
  #tb-down  { left: 59px;  bottom: 104px; width: 56px; height: 56px; font-size:16px;}
  #tb-jump  { right: 18px;  bottom: 96px; width: 76px; height: 76px; background: rgba(120,220,120,.45); }
  #tb-egg   { right: 104px; bottom: 26px; background: rgba(255,240,150,.5); }
  #tb-eat   { right: 18px;  bottom: 8px;  background: rgba(255,150,150,.45); }

  #mute-btn, #pause-btn {
    position: fixed; top: 74px; z-index: 30; width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.8); background: rgba(255,255,255,.4);
    font-size: 18px; cursor: pointer; display: none;
  }
  body.playing #mute-btn, body.playing #pause-btn { display: block; }
  #mute-btn { right: 58px; } #pause-btn { right: 10px; }

  #fader { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .5s; z-index: 40; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud">
  <div class="top">
    <div>
      <div class="hud-card" id="fruit-counter">🍎 <span id="fruit-num">0</span><span class="goal"> / 30</span></div>
      <div class="hud-card" id="fruit-row" style="margin-top:6px;"></div>
    </div>
    <div class="hud-card" id="petals">🌸</div>
    <div>
      <div class="hud-card" id="score-card">SCORE <span id="score-num">0</span><div id="combo-label"></div></div>
    </div>
  </div>
  <div id="stage-banner"></div>
  <div id="hint-msg"></div>
</div>

<div id="touch-ui">
  <div class="tbtn" id="tb-left">◀</div>
  <div class="tbtn" id="tb-right">▶</div>
  <div class="tbtn" id="tb-down">▼</div>
  <div class="tbtn" id="tb-jump">ジャンプ</div>
  <div class="tbtn" id="tb-egg">タマゴ</div>
  <div class="tbtn" id="tb-eat">たべる</div>
</div>

<button id="mute-btn" title="ミュート">🔊</button>
<button id="pause-btn" title="ポーズ">⏸</button>

<div class="overlay" id="title-screen">
  <div class="bubble">
    <h1 class="logo">ヨッシーアイランド<br>ストーリー</h1>
    <div class="subtitle">〜 フルーツだいすき! 30こ あつめよう 〜</div>
    <div class="press-start">クリック か スペースキー で スタート!</div>
    <div class="controls">
      <b>← →</b> はしる &nbsp; <b>スペース</b> ジャンプ(空中で長おし=ふんばり)<br>
      <b>↓</b> ヒップドロップ &nbsp; <b>X</b> したでパクッ(タマゴになるよ)<br>
      <b>C</b> 長おしでねらって はなすとタマゴなげ &nbsp; <b>Esc</b> ポーズ
    </div>
    <div id="best-score" style="margin-top:12px;color:#c90;font-weight:bold;"></div>
  </div>
</div>

<div class="overlay hidden" id="clear-screen">
  <div class="big-msg" id="clear-title">ステージクリア!</div>
  <div class="bubble" style="margin-top:18px;">
    <div class="tally" id="clear-tally"></div>
    <div class="press-start" id="clear-next">クリック か スペースキー で つぎへ!</div>
  </div>
</div>

<div class="overlay hidden" id="gameover-screen">
  <div class="big-msg" style="color:#ffd7d7;">ゲームオーバー…</div>
  <div class="bubble" style="margin-top:18px;">
    <div class="tally">げんきを だして もういちど!</div>
    <div class="press-start">クリック か スペースキー で リトライ</div>
  </div>
</div>

<div class="overlay hidden" id="pause-screen">
  <div class="bubble">
    <div class="big-msg" style="color:#ffb2c8;text-shadow:0 3px 0 rgba(0,0,0,.1);">ポーズ</div>
    <div class="press-start">Esc か クリックで さいかい</div>
  </div>
</div>

<div id="fader"></div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
